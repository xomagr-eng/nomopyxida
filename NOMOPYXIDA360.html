<style>
  :root{
    --bg:#0e1116; --bg2:#151b23; --panel:#1b232d; --panel2:#212c38;
    --line:#2c3947; --line2:#3a4a5c;
    --txt:#eef3f8; --muted:#9fb0c2; --dim:#6f8296;
    --red:#e63329; --red2:#ff5147; --amber:#ffb020; --amber2:#ffce6a;
    --blue:#3d9be0; --gold:#d9a441;
    --shadow:0 6px 24px rgba(0,0,0,.45);
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 80% -10%, #1a2431 0%, var(--bg) 55%) fixed;
    color:var(--txt);
    font-family:"Segoe UI",system-ui,Roboto,Arial,sans-serif;
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--amber2);text-decoration:none}
  a:hover{text-decoration:underline}
  h1,h2,h3,h4{margin:0 0 .4em;font-weight:700;letter-spacing:.2px}
  .wrap{max-width:1240px;margin:0 auto;padding:0 18px 90px}

  header.top{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(180deg,rgba(14,17,22,.98),rgba(14,17,22,.9));
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  }
  .top-in{max-width:1240px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer}
  .logo{
    width:46px;height:46px;border-radius:12px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--red),#8f1a14);
    display:grid;place-items:center;box-shadow:var(--shadow);position:relative;overflow:hidden
  }
  .logo svg{width:28px;height:28px}
  .brand h1{font-size:20px;margin:0;line-height:1.05}
  .brand .sub{font-size:10.5px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
  .brand .copy{font-size:9.5px;color:var(--dim);letter-spacing:.6px;margin-top:2px}
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  nav.tabs button{
    background:var(--panel);color:var(--muted);border:1px solid var(--line);
    padding:9px 13px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600;
    display:flex;align-items:center;gap:7px;transition:.15s;
  }
  nav.tabs button:hover{color:var(--txt);border-color:var(--line2);background:var(--panel2)}
  nav.tabs button.active{background:linear-gradient(135deg,var(--red),#a01f18);color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(230,51,41,.35)}
  @media(max-width:760px){
    .top-in{gap:8px}
    .brand h1{font-size:16px}
    nav.tabs{flex-wrap:nowrap;overflow-x:auto;margin-left:0;width:100%;
      padding:2px 2px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    nav.tabs::-webkit-scrollbar{display:none}
    nav.tabs button{flex:0 0 auto;white-space:nowrap}
  }

  section.view{display:none;animation:fade .25s ease}
  section.view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .hero{
    margin-top:22px;padding:30px;border-radius:var(--r);
    background:linear-gradient(120deg,#1e2935,#141b23);
    border:1px solid var(--line);position:relative;overflow:hidden
  }
  .hero:before{content:"";position:absolute;inset:0;background:
     repeating-linear-gradient(45deg,rgba(217,164,65,.05) 0 14px,transparent 14px 28px);pointer-events:none}
  .hero h2{font-size:30px;margin-bottom:8px;position:relative}
  .hero p{color:var(--muted);max-width:840px;font-size:15.5px;position:relative}

  .searchbar{margin-top:20px;position:relative;display:flex;gap:10px;flex-wrap:wrap}
  .searchbar input{
    flex:1;min-width:240px;background:var(--bg2);border:1px solid var(--line2);color:var(--txt);
    padding:15px 17px;border-radius:12px;font-size:16px;outline:none
  }
  .searchbar input:focus{border-color:var(--red)}

  .btn{border:none;border-radius:11px;padding:13px 20px;font-size:14.5px;font-weight:700;cursor:pointer;
    display:inline-flex;align-items:center;gap:9px;transition:.15s}
  .btn.primary{background:linear-gradient(135deg,var(--red),#a01f18);color:#fff;box-shadow:0 4px 16px rgba(230,51,41,.35)}
  .btn.primary:hover{transform:translateY(-2px)}
  .btn.ghost{background:var(--panel);color:var(--txt);border:1px solid var(--line2)}
  .btn.ghost:hover{background:var(--panel2)}
  .btn.sm{padding:8px 13px;font-size:13px;border-radius:9px}

  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:920px){.g2,.g3,.g4{grid-template-columns:1fr}}
  /* Οριζόντια θέση (landscape) κινητού/τάμπλετ: αξιοποίηση πλάτους — μεγαλύτερη διάταξη */
  @media (orientation:landscape) and (max-width:1000px){
    .g2{grid-template-columns:repeat(2,1fr)}
    .g3{grid-template-columns:repeat(2,1fr)}
    .g4{grid-template-columns:repeat(2,1fr)}
    .hero{margin-top:14px;padding:20px}

    .hero p{font-size:14px}
    section.view{max-width:100%}
  }

    .g3{grid-template-columns:repeat(3,1fr)}
    .g4{grid-template-columns:repeat(3,1fr)}
  }
  /* Μεγάλες οθόνες / τάμπλετ landscape: πιο πλατύ περιεχόμενο */
  @media (min-width:1500px){ .wrap{max-width:1440px} }

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
  .card h3{font-size:16.5px;display:flex;align-items:center;gap:9px}

  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;transition:.15s;position:relative}
  .tile:hover{border-color:var(--red);transform:translateY(-3px);background:var(--panel2)}
  .tile .big{font-size:30px}
  .tile h4{margin:10px 0 4px;font-size:16px}
  .tile p{margin:0;color:var(--muted);font-size:13px}

  .sectitle{margin:30px 0 14px;font-size:22px;display:flex;align-items:center;gap:10px}
  .sectitle small{font-size:13px;color:var(--muted);font-weight:500}

  .disclaimer{
    margin-top:18px;background:rgba(255,176,32,.08);border:1px solid rgba(255,176,32,.35);
    border-radius:12px;padding:13px 16px;font-size:13px;color:var(--amber2);display:flex;gap:10px;align-items:flex-start
  }
  .disclaimer b{color:var(--amber)}

  /* accordion */
  .acc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
  .acc>.head{padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:12px;user-select:none}
  .acc>.head:hover{background:var(--panel2)}
  .acc>.head .ic{font-size:24px}
  .acc>.head .t{flex:1}
  .acc>.head .t h3{margin:0;font-size:16.5px}
  .acc>.head .t p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  .acc>.head .chev{color:var(--dim);transition:.2s}
  .acc.open>.head .chev{transform:rotate(90deg);color:var(--red2)}
  .acc>.body{display:none;padding:2px 18px 18px;border-top:1px solid var(--line)}
  .acc.open>.body{display:block}

  .art{border-left:3px solid var(--red);background:var(--bg2);border-radius:0 10px 10px 0;padding:12px 15px;margin:12px 0}
  .art .num{font-size:12px;font-weight:700;color:var(--red2);text-transform:uppercase;letter-spacing:.5px}
  .art h4{margin:3px 0 6px;font-size:15.5px}
  .art p{margin:0;color:var(--muted);font-size:14px}
  .art .tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:11px;background:var(--panel2);border:1px solid var(--line2);color:var(--muted);padding:3px 9px;border-radius:20px}
  .chip.red{color:var(--red2);border-color:rgba(230,51,41,.4)}

  /* search results */
  .res{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:11px;cursor:pointer;transition:.14s}
  .res:hover{border-color:var(--red);background:var(--panel2)}
  .res .kind{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--gold)}
  .res h4{margin:4px 0 5px;font-size:16px}
  .res p{margin:0;color:var(--muted);font-size:13.5px}
  .res mark{background:rgba(255,176,32,.25);color:var(--amber2);padding:0 2px;border-radius:3px}
  .empty{text-align:center;color:var(--dim);padding:50px 20px;font-size:15px}

  /* wizard / situations */
  .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
  .filterbar button{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600}
  .filterbar button.active{background:var(--red);color:#fff;border-color:transparent}

  .steps{counter-reset:s;margin:10px 0;padding:0;list-style:none}
  .steps li{position:relative;padding:8px 0 8px 40px;border-bottom:1px dashed var(--line)}
  .steps li:last-child{border-bottom:none}
  .steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:7px;width:26px;height:26px;
    background:var(--red);color:#fff;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}

  .kv{display:flex;gap:10px;margin:6px 0;font-size:14px}
  .kv .k{color:var(--gold);font-weight:600;min-width:120px;flex:0 0 auto}
  .kv .v{color:var(--txt)}

  .lawref{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line2);color:var(--amber2);
    padding:5px 11px;border-radius:8px;font-size:12.5px;margin:4px 6px 0 0;cursor:pointer}
  .lawref:hover{border-color:var(--red)}

  /* wizard */
  .wiz-q{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);max-width:760px;margin:0 auto}
  .wiz-q h3{font-size:20px;margin-bottom:18px}
  .opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line2);color:var(--txt);
    padding:15px 17px;border-radius:11px;cursor:pointer;font-size:15.5px;font-weight:600;margin-bottom:10px;transition:.14s}
  .opt:hover{border-color:var(--red);background:var(--panel2);transform:translateX(3px)}
  .opt .oi{font-size:23px;flex:0 0 auto}
  .opt small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px}
  .crumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;font-size:12.5px;color:var(--muted);max-width:760px;margin-left:auto;margin-right:auto}
  .crumbs span{background:var(--bg2);border:1px solid var(--line);padding:5px 10px;border-radius:8px}
  .crumbs span.cur{color:var(--red2);border-color:rgba(230,51,41,.4)}

  /* templates */
  .tmpl-body{white-space:pre-wrap;font-family:"Consolas","Courier New",monospace;font-size:13px;background:var(--bg2);
    border:1px solid var(--line2);border-radius:10px;padding:16px;color:var(--txt);line-height:1.7;max-height:520px;overflow:auto}

  .back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);cursor:pointer;font-size:13.5px;margin-bottom:14px}
  .back:hover{color:var(--red2)}

  .person{display:flex;gap:14px;align-items:flex-start}
  .person .pic{font-size:30px;flex:0 0 auto;width:50px;height:50px;display:grid;place-items:center;background:var(--bg2);border-radius:12px;border:1px solid var(--line2)}
  .person h4{margin:0 0 3px}
  .person p{margin:0;color:var(--muted);font-size:13px}
  .person .how{margin-top:6px;font-size:12.5px;color:var(--amber2)}

  .foot{text-align:center;color:var(--dim);font-size:12px;margin-top:40px;line-height:1.8}
  details.gl{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:9px;padding:0}
  details.gl summary{padding:13px 16px;cursor:pointer;font-weight:600;font-size:14.5px}
  details.gl[open] summary{color:var(--red2)}
  details.gl p{margin:0;padding:0 16px 15px;color:var(--muted);font-size:13.5px}
  .hl{color:var(--red2);font-weight:700}

  /* safe-area (notch) & PWA install button */
  header.top{padding-top:env(safe-area-inset-top)}
  .wrap{padding-left:calc(18px + env(safe-area-inset-left));padding-right:calc(18px + env(safe-area-inset-right))}
  #installBtn{
    position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:90;display:none;
    background:linear-gradient(135deg,var(--red),#a01f18);color:#fff;border:none;border-radius:30px;
    padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(230,51,41,.5);
    align-items:center;gap:8px
  }
  #installBtn:hover{transform:translateY(-2px)}

  /* πηγές δικαίου */
  .srcbox{margin-top:14px;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;overflow:hidden}
  .srcbox summary{padding:13px 16px;cursor:pointer;font-weight:700;font-size:14px;color:var(--amber2);list-style:none}
  .srcbox summary::-webkit-details-marker{display:none}
  .srcbox summary:before{content:"📚 ";}
  .srcbox[open] summary{border-bottom:1px solid var(--line)}
  .srcg{padding:8px 16px 4px}
  .srcg h5{margin:10px 0 6px;font-size:13px;color:var(--gold);font-weight:700}
  .srcrow{font-size:13px;color:var(--muted);padding:5px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px;flex-wrap:wrap}
  .srcrow:last-child{border-bottom:none}
  .srcrow .rr{color:var(--txt);font-weight:600;flex:0 0 auto}
  .srcrow a.rr{color:var(--amber2)}
  .srcrow a.rr:hover{color:var(--red2)}
  .srcrow .rt{color:var(--muted)}
  .fekchip{font-size:10.5px;background:var(--panel2);border:1px solid var(--line2);color:var(--amber2);padding:2px 8px;border-radius:20px;flex:0 0 auto;white-space:nowrap}
  .fekchip:hover{border-color:var(--red);text-decoration:none}
  .srcnote{padding:9px 16px 13px;font-size:11.5px;color:var(--dim);border-top:1px solid var(--line);margin-top:4px}
  .srcnote a{color:var(--amber2)}
</style>
</head>

/* ============================================================

/* ---------- ΝΟΜΟΘΕΣΙΑ ανά κλάδο ---------- */
const LAW_AREAS = [
{
  id:"syntagma", icon:"🏛️", name:"Σύνταγμα", color:"gold",
  desc:"Ο θεμελιώδης νόμος του Κράτους — θεμελιώδη δικαιώματα & ελευθερίες.",
  items:[
    {n:"Άρθρο 2", t:"Αξία του ανθρώπου", x:"Ο σεβασμός και η προστασία της αξίας του ανθρώπου αποτελούν πρωταρχική υποχρέωση της Πολιτείας. Θεμέλιο όλων των ατομικών δικαιωμάτων."},
    {n:"Άρθρο 4", t:"Ισότητα των Ελλήνων", x:"Όλοι οι Έλληνες είναι ίσοι ενώπιον του νόμου· έχουν ίσα δικαιώματα και υποχρεώσεις. Άνδρες και γυναίκες έχουν ίσα δικαιώματα. Συνεισφορά στα δημόσια βάρη ανάλογα με τις δυνάμεις καθενός."},
    {n:"Άρθρο 5", t:"Ελεύθερη ανάπτυξη προσωπικότητας", x:"Καθένας έχει δικαίωμα να αναπτύσσει ελεύθερα την προσωπικότητά του και να συμμετέχει στην κοινωνική/οικονομική/πολιτική ζωή, εφόσον δεν προσβάλλει δικαιώματα άλλων, το Σύνταγμα ή τα χρηστά ήθη. Προστασία ζωής, τιμής, ελευθερίας."},
    {n:"Άρθρο 5Α", t:"Δικαίωμα στην πληροφόρηση", x:"Καθένας έχει δικαίωμα στην πληροφόρηση και στη συμμετοχή στην Κοινωνία της Πληροφορίας. Η διευκόλυνση πρόσβασης στην ψηφιακή πληροφορία αποτελεί υποχρέωση του Κράτους."},
    {n:"Άρθρο 9", t:"Άσυλο κατοικίας", x:"Η κατοικία του καθενός είναι άσυλο. Η ιδιωτική και οικογενειακή ζωή προστατεύεται. Καμία έρευνα σε κατοικία χωρίς την παρουσία εκπροσώπων της δικαστικής εξουσίας."},
    {n:"Άρθρο 9Α", t:"Προστασία προσωπικών δεδομένων", x:"Καθένας έχει δικαίωμα προστασίας από τη συλλογή, επεξεργασία και χρήση των προσωπικών του δεδομένων. Η προστασία διασφαλίζεται από ανεξάρτητη αρχή (ΑΠΔΠΧ)."},
    {n:"Άρθρο 14", t:"Ελευθερία έκφρασης & Τύπου", x:"Καθένας μπορεί να εκφράζει και να διαδίδει προφορικά, γραπτά και διά του Τύπου τους στοχασμούς του. Ο Τύπος είναι ελεύθερος· η λογοκρισία απαγορεύεται."},
    {n:"Άρθρο 17", t:"Προστασία ιδιοκτησίας", x:"Η ιδιοκτησία τελεί υπό την προστασία του Κράτους. Κανείς δεν στερείται την ιδιοκτησία του παρά μόνο για δημόσια ωφέλεια, με πλήρη αποζημίωση που καθορίζει το δικαστήριο."},
    {n:"Άρθρο 20", t:"Δικαστική προστασία & προηγούμενη ακρόαση", x:"Καθένας έχει δικαίωμα να προσφύγει στα δικαστήρια. Το δικαίωμα προηγούμενης ακρόασης ισχύει και για κάθε διοικητική ενέργεια σε βάρος δικαιωμάτων/συμφερόντων του."},
    {n:"Άρθρο 21", t:"Προστασία οικογένειας, παιδιού, νεότητας", x:"Η οικογένεια, ο γάμος, η μητρότητα και η παιδική ηλικία τελούν υπό την προστασία του Κράτους. Ειδική φροντίδα σε πολύτεκνους, ΑμεΑ, ηλικιωμένους."},
    {n:"Άρθρο 22", t:"Δικαίωμα στην εργασία", x:"Η εργασία αποτελεί δικαίωμα και προστατεύεται. Όλοι οι εργαζόμενοι δικαιούνται ίση αμοιβή για παρεχόμενη εργασία ίσης αξίας. Ελευθερία συνδικαλισμού."},
    {n:"Άρθρο 25", t:"Αρχή του κοινωνικού κράτους & αναλογικότητας", x:"Τα δικαιώματα του ανθρώπου τελούν υπό την εγγύηση του Κράτους. Οι περιορισμοί των δικαιωμάτων πρέπει να σέβονται την αρχή της αναλογικότητας (κατάλληλοι, αναγκαίοι, εν στενή εννοία ανάλογοι)."}
  ],
  links:[{label:"Πλήρες κείμενο (Βουλή)",url:"https://www.hellenicparliament.gr/Vouli-ton-Ellinon/To-Politevma/Syntagma/"}]
},
{
  id:"astiko", icon:"⚖️", name:"Αστικός Κώδικας", color:"blue",
  desc:"Δικαιοπραξίες, ενοχές, εμπράγματο, οικογενειακό & κληρονομικό δίκαιο.",
  items:[
    {n:"ΑΚ 174 & 178-179", t:"Άκυρες & καταχρηστικές δικαιοπραξίες", x:"Άκυρη η δικαιοπραξία που αντιβαίνει σε απαγορευτική διάταξη νόμου ή στα χρηστά ήθη. Καταχρηστική/υπέρμετρη δέσμευση της ελευθερίας είναι άκυρη."},
    {n:"ΑΚ 197-198", t:"Ευθύνη κατά τις διαπραγματεύσεις", x:"Στο στάδιο των διαπραγματεύσεων τα μέρη οφείλουν αμοιβαία συμπεριφορά καλής πίστης· όποιος υπαίτια ζημιώσει τον άλλον υποχρεούται σε αποζημίωση, ακόμη κι αν δεν καταρτιστεί σύμβαση."},
    {n:"ΑΚ 247-249", t:"Παραγραφή αξιώσεων", x:"Η γενική παραγραφή των αξιώσεων είναι 20 έτη (ΑΚ 249). Η παραγραφή αρχίζει όταν γεννηθεί η αξίωση και είναι δυνατή η δικαστική επιδίωξή της."},
    {n:"ΑΚ 250", t:"Πενταετής παραγραφή", x:"Σε 5 έτη παραγράφονται αξιώσεις εμπόρων/επαγγελματιών για εμπορεύματα-υπηρεσίες, μισθοί, ενοίκια, τόκοι, αμοιβές δικηγόρων/γιατρών κ.λπ. Χρήσιμο σε παλιές οφειλές."},
    {n:"ΑΚ 288", t:"Καλή πίστη στην εκπλήρωση παροχής", x:"Ο οφειλέτης έχει υποχρέωση να εκπληρώσει την παροχή όπως απαιτεί η καλή πίστη, αφού ληφθούν υπόψη και τα συναλλακτικά ήθη. Βάση για αναπροσαρμογή/επιείκεια."},
    {n:"ΑΚ 340 & 345", t:"Υπερημερία οφειλέτη & τόκοι", x:"Αν ο οφειλέτης καθυστερεί υπαίτια, περιέρχεται σε υπερημερία μετά από όχληση. Οφείλει τόκους υπερημερίας και αποζημίωση για περαιτέρω ζημία."},
    {n:"ΑΚ 388", t:"Απρόοπτη μεταβολή συνθηκών", x:"Αν μετά τη σύναψη αμφοτεροβαρούς σύμβασης μεταβλήθηκαν έκτακτα & απρόβλεπτα οι συνθήκες ώστε η παροχή να γίνει υπέρμετρα επαχθής, το δικαστήριο μπορεί να αναπροσαρμόσει ή να λύσει τη σύμβαση."},
    {n:"ΑΚ 904", t:"Αδικαιολόγητος πλουτισμός", x:"Όποιος έγινε πλουσιότερος χωρίς νόμιμη αιτία από την περιουσία ή με ζημία άλλου υποχρεούται να αποδώσει την ωφέλεια (π.χ. αχρεωστήτως καταβληθέντα)."},
    {n:"ΑΚ 914 & 932", t:"Αδικοπραξία & ηθική βλάβη", x:"Όποιος ζημιώσει άλλον παράνομα και υπαίτια υποχρεούται σε αποζημίωση. Σε περίπτωση αδικοπραξίας το δικαστήριο επιδικάζει και εύλογη χρηματική ικανοποίηση λόγω ηθικής βλάβης· σε θάνατο, ψυχική οδύνη στους οικείους."},
    {n:"ΑΚ 1033 & 369", t:"Μεταβίβαση ακινήτου", x:"Για τη μεταβίβαση κυριότητας ακινήτου απαιτείται συμβολαιογραφικό έγγραφο και μεταγραφή/καταχώριση στο Κτηματολόγιο. Χωρίς αυτά δεν επέρχεται η μεταβίβαση."},
    {n:"ΑΚ 1041 & 1045", t:"Χρησικτησία", x:"Τακτική χρησικτησία: κυριότητα με καλή πίστη + νόμιμο τίτλο + νομή 10 ετών. Έκτακτη: νομή πράγματος επί 20 έτη, χωρίς τίτλο."},
    {n:"ΑΚ 1710 & 1825", t:"Κληρονομιά & νόμιμη μοίρα", x:"Με τον θάνατο η περιουσία (κληρονομιά) περιέρχεται στους κληρονόμους. Κατιόντες, γονείς και σύζυγος είναι μεριδούχοι: η νόμιμη μοίρα είναι το ½ της εξ αδιαθέτου μερίδας και δεν θίγεται από διαθήκη."},
    {n:"ΑΚ 1847-1850", t:"Αποδοχή & αποποίηση κληρονομιάς", x:"Ο κληρονόμος μπορεί να αποποιηθεί την κληρονομιά εντός 4 μηνών (1 έτος αν διαμένει στο εξωτερικό ή ο κληρονομούμενος πέθανε στο εξωτερικό). Η προθεσμία αρχίζει από τη γνώση της επαγωγής. Σιωπή = αποδοχή."}
  ],
  links:[{label:"Αστικός Κώδικας (kodiko.gr)",url:"https://www.kodiko.gr/nomothesia/document/216337"}]

    {n:"άρ.168", t:"Πολλαπλό τέλος", x:"Το «πολλαπλό τέλος» επιβάλλεται ως διοικητική κύρωση σε τελωνειακές παραβάσεις/λαθρεμπορία, υπολογιζόμενο ως πολλαπλάσιο των διαφυγόντων δασμών & φόρων, με ελάχιστα/μέγιστα όρια. Είναι διακριτό από την ποινική ευθύνη."},
    {n:"άρ.170", t:"Διοικητική ανάκριση & καταλογιστική πράξη", x:"Η τελωνειακή αρχή διενεργεί διοικητική ανάκριση και εκδίδει καταλογιστική πράξη (με δικαίωμα προηγούμενης ακρόασης του εμπλεκομένου). Κατά της πράξης χωρεί προσφυγή στα Διοικητικά Δικαστήρια."},
    {n:"άρ.174-178", t:"Λαθρεμπορία — ορισμός, ποινές, δήμευση", x:"Ορίζεται η λαθρεμπορία (διαφυγή δασμών/φόρων ή διακίνηση χωρίς άδεια), οι ποινικές κυρώσεις και η δήμευση των αντικειμένων. Συνυπάρχει διοικητική (πολλαπλό τέλος) και ποινική διάσταση."},
    {n:"άρ.179-186", t:"Κατάσχεση, φύλαξη & εκποίηση", x:"Ρυθμίζεται η κατάσχεση εμπορευμάτων/μεταφορικών μέσων, η φύλαξη και η εκποίηση/καταστροφή κατασχεθέντων. Ο ενδιαφερόμενος έχει δικαιώματα ενημέρωσης & προσφυγής."},
    {n:"ΕΦΚ & τελωνισμός", t:"Ειδικοί Φόροι Κατανάλωσης", x:"Ο Κώδικας διέπει και τους ΕΦΚ (ενέργεια, αλκοόλ, καπνικά) και τις διαδικασίες τελωνισμού (εισαγωγή/εξαγωγή/διαμετακόμιση), σε συνδυασμό με τον Ενωσιακό Τελωνειακό Κώδικα (Καν. ΕΕ 952/2013)."}

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function renderTabs(){
  el("tabs").innerHTML = TABS.map(t=>
    `<button data-t="${t.id}" class="${t.id===curTab?'active':''}" onclick="go('${t.id}')"><span>${t.icon}</span>${t.label}</button>`
  ).join("");
}
function go(t){
  curTab=t;
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  el("view-"+t).classList.add("active");
  renderTabs();
  window.scrollTo({top:0,behavior:"smooth"});
  try{ localStorage.setItem('np_tab', t); }catch(e){}
}

function buildIndex(){
  const idx=[];
  LAW_AREAS.forEach(a=>a.items.forEach(it=>{
    idx.push({kind:"Νομοθεσία — "+a.name, title:it.n+" — "+it.t, text:it.x, act:`go('law');setTimeout(()=>openArea('${a.id}',true),60)`, hay:(a.name+" "+it.n+" "+it.t+" "+it.x).toLowerCase()});
  }));
  LAW_AREAS.forEach(a=>(LEGAL_REFS[a.id]||[]).forEach(gp=>gp.items.forEach(it=>{
    const act = it.url ? `window.open('${it.url}','_blank','noopener')` : `go('law');setTimeout(()=>openArea('${a.id}',true),60)`;
    idx.push({kind:"Πηγή δικαίου — "+a.name, title:it.r+" — "+it.t, text:gp.g+" · "+a.name, act:act, hay:(a.name+" "+it.r+" "+it.t+" "+gp.g).toLowerCase()});
  })));
  SITUATIONS.forEach(s=>{
    idx.push({kind:"Σύμβουλος — "+s.cat, title:s.title, text:s.apply, act:`go('advisor');setTimeout(()=>openSituation('${s.id}'),60)`, hay:(s.title+" "+s.cat+" "+s.situation+" "+s.apply+" "+s.steps.join(" ")).toLowerCase()});
  });
  TEMPLATES.forEach(t=>{
    idx.push({kind:"Πρότυπο — "+t.cat, title:t.title, text:"Έτοιμο πρότυπο εγγράφου προς συμπλήρωση.", act:`go('templates');setTimeout(()=>openTemplate('${t.id}'),60)`, hay:(t.title+" "+t.cat+" "+t.body).toLowerCase()});
  });
  GLOSSARY.forEach(g=>{
    idx.push({kind:"Λεξικό", title:g.t, text:g.d, act:`go('glossary')`, hay:(g.t+" "+g.d).toLowerCase()});
  });
  return idx;
}

function renderSearch(){
  el("view-search").innerHTML=`
    <div class="hero" style="padding:24px">
      <h2 style="font-size:24px">🔎 Έξυπνη Αναζήτηση</h2>
      <p>Αναζητήστε σε ολόκληρη τη βάση: νομοθεσία, καταστάσεις, πρότυπα & όρους. Γράψτε λέξεις-κλειδιά στα ελληνικά.</p>

let curKind="Όλα";
function setKind(k,btn){curKind=k;document.querySelectorAll('#skinds button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');doSearch();}
function hilite(text,terms){
  let t=esc(text);
  terms.forEach(term=>{ if(term.length<2)return; const re=new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); t=t.replace(re,'<mark>$1</mark>');});
  return t;
}
function doSearch(){
  if(!SEARCH_INDEX) SEARCH_INDEX=buildIndex();
  const q=(el("mainq").value||"").trim().toLowerCase();
  const box=el("results");
  const terms=q.split(/\s+/).filter(Boolean);
  let list=SEARCH_INDEX;
  if(curKind!=="Όλα") list=list.filter(r=>r.kind.startsWith(curKind));
  if(q){
    list=list.map(r=>{
      let score=0; terms.forEach(t=>{ if(r.hay.includes(t)) score+= (r.title.toLowerCase().includes(t)?3:1); });
      return {r,score};
    }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).map(x=>x.r);
  }
  if(!q && curKind==="Όλα"){ box.innerHTML=`<div class="empty">✍️ Γράψτε κάτι για να ξεκινήσει η αναζήτηση — ή περιηγηθείτε από τις καρτέλες.</div>`; return; }
  if(!list.length){ box.innerHTML=`<div class="empty">😕 Δεν βρέθηκε κάτι για «${esc(q)}». Δοκιμάστε άλλη λέξη-κλειδί ή δείτε τους «Κλάδους Δικαίου».</div>`; return; }
  box.innerHTML=list.slice(0,40).map(r=>
    `<div class="res" onclick="${r.act}">
       <div class="kind">${esc(r.kind)}</div>
       <h4>${hilite(r.title,terms)}</h4>
       <p>${hilite(r.text.slice(0,220)+(r.text.length>220?'…':''),terms)}</p>
     </div>`).join("");
}

function copyTmpl(id){
  const t=TEMPLATES.find(x=>x.id===id); if(!t)return;
  const btn=(typeof event!=='undefined'&&event)?event.target:null;
  const flash=(msg)=>{ if(btn){const o=btn.textContent;btn.textContent=msg;setTimeout(()=>btn.textContent=o,1600);} };
  const fallback=()=>{ try{const ta=document.createElement('textarea');ta.value=t.body;ta.style.position='fixed';ta.style.top='-1000px';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');document.body.removeChild(ta);flash("✓ Αντιγράφηκε");}catch(e){flash("⚠ Επιλέξτε χειροκίνητα");} };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t.body).then(()=>flash("✓ Αντιγράφηκε")).catch(fallback); }
  else { fallback(); }
}
function downloadTmpl(id){const t=TEMPLATES.find(x=>x.id===id);const blob=new Blob([t.body],{type:"text/plain;charset=utf-8"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=t.title.replace(/[^\wα-ωΑ-Ω]+/g,"_")+".txt";a.click();URL.revokeObjectURL(u);}
function printTmpl(id){const t=TEMPLATES.find(x=>x.id===id);const w=window.open("","_blank");w.document.write(`<html><head><meta charset="utf-8"><title>${esc(t.title)}</title><style>body{font-family:'Courier New',monospace;white-space:pre-wrap;padding:40px;font-size:13px;line-height:1.7}</style></head><body>${esc(t.body)}</body></html>`);w.document.close();w.print();}

    {oi:"🔐", label:"Παραβίαση των δεδομένων μου", sit:"gdpr"},
    {oi:"💻", label:"Προσβολή / δημοσίευση στο ίντερνετ", sit:"synykofantia"},
    {oi:"ℹ️", label:"Γενικά για GDPR & δικαιώματα", area:"data"}
  ]}
};
let wizStack=["root"];
function renderWizard(){
  el("view-wizard").innerHTML=`
    <div class="sectitle">❓ Οδηγός — «Βρες τι ισχύει για σένα» <small>απάντησε σε λίγες ερωτήσεις</small></div>
    <div id="wizCrumbs" class="crumbs"></div>
    <div id="wizBox"></div>
    ${DISCLAIMER}`;
  wizStack=["root"]; drawWiz();
}
function drawWiz(){
  const id=wizStack[wizStack.length-1]; const n=WIZARD[id]; if(!n)return;
  el("wizCrumbs").innerHTML = wizStack.map((x,i)=>`<span class="${i===wizStack.length-1?'cur':''}" onclick="wizJump(${i})" style="cursor:pointer">${esc(WIZARD[x].crumb)}</span>`).join(' <span style="border:none;background:none;padding:0">→</span> ');
  el("wizBox").innerHTML=`
    <div class="wiz-q">
      ${wizStack.length>1?`<div class="back" onclick="wizBack()">← Προηγούμενη ερώτηση</div>`:''}
      <h3>${esc(n.q)}</h3>
      ${n.opts.map((o,i)=>`<button class="opt" onclick="wizPick(${i})">
        <span class="oi">${o.oi||'▸'}</span>
        <span>${esc(o.label)}${o.small?`<small>${esc(o.small)}</small>`:''}</span>
      </button>`).join("")}
    </div>`;
  el("wizBox").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function wizPick(i){
  const n=WIZARD[wizStack[wizStack.length-1]]; const o=n.opts[i];
  if(o.node){ wizStack.push(o.node); drawWiz(); }
  else if(o.sit){ go('advisor'); setTimeout(()=>openSituation(o.sit),60); }
  else if(o.area){ go('law'); setTimeout(()=>openArea(o.area),60); }
}
function wizBack(){ if(wizStack.length>1){wizStack.pop(); drawWiz();} }
function wizJump(i){ wizStack=wizStack.slice(0,i+1); drawWiz(); }

/* ---- INIT ---- */
function init(){
  renderTabs();
  renderHome(); renderSearch(); renderLaw(); renderWizard(); renderAdvisor();
  renderTemplates(); renderPeople(); renderGlossary(); renderSources();
  let start='home';
  try{ const s=localStorage.getItem('np_tab'); if(s && document.getElementById('view-'+s)) start=s; }catch(e){}
  go(start);
}
init();
</script>

<button id="installBtn">⬇️ Εγκατάσταση εφαρμογής</button>
<script>
/* PWA: install prompt + service worker */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=document.getElementById('installBtn');if(b)b.style.display='inline-flex';});
window.addEventListener('appinstalled',()=>{const b=document.getElementById('installBtn');if(b)b.style.display='none';deferredPrompt=null;});
document.addEventListener('click',ev=>{
  if(ev.target && ev.target.id==='installBtn' && deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(()=>{deferredPrompt=null; const b=document.getElementById('installBtn'); if(b) b.style.display='none';});
  }
});
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ // single-file offline build: SW skipped (needs http/https) });
}
</script>
